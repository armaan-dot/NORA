# =============================================================================
# NORA – Continuous Integration
# Triggered on push/PR to main
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 – Lint (ruff + black + mypy)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff black mypy

      - name: Run ruff
        run: ruff check core/ ml/

      - name: Run black (check mode)
        run: black --check core/ ml/

      - name: Run mypy
        run: mypy --ignore-missing-imports core/ ml/

  # ---------------------------------------------------------------------------
  # Job 2 – Test core package
  # ---------------------------------------------------------------------------
  test-core:
    name: Test – core
    runs-on: ubuntu-22.04
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run core tests
        run: pytest core/tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Job 3 – Test ml package
  # ---------------------------------------------------------------------------
  test-ml:
    name: Test – ml
    runs-on: ubuntu-22.04
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ml tests
        run: pytest ml/tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Job 4 – Build ROS 2 workspace (Humble)
  # ---------------------------------------------------------------------------
  build-ros:
    name: Build – ROS 2 Humble
    runs-on: ubuntu-22.04
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install rosdep dependencies
        working-directory: ros2_ws
        run: |
          sudo rosdep init || true
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build workspace with colcon
        working-directory: ros2_ws
        run: |
          source /opt/ros/humble/setup.bash
          colcon build \
            --symlink-install \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
        shell: bash
