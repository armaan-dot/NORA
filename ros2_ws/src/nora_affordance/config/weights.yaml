affordance_node:
  ros__parameters:
    usefulness_weight: 0.6
    feasibility_weight: 0.4
    base_link: "base_link"
    tip_links: ["tcp", "gripper_link"]   # first one present in the URDF is used
    arm_joints: ["joint1", "joint2", "joint3", "joint4", "joint5", "joint6"]
    tool_axis: [0.0, 0.0, 1.0]           # tip-frame axis that points down for a top-down grasp
    approach_height: 0.02                # IK goal above the target position [m]
    ik_position_tolerance: 0.01          # [m]
    ik_angle_tolerance_deg: 10.0
    gripper_half_width: 0.085            # [m]
    clearance_margin: 0.015              # [m]
    assumed_object_radius: 0.03          # WorldObject has no size; every object is assumed this wide [m]
