nora_bt_executor:
  ros__parameters:
    tick_period_ms: 20
    # Retries of a single skill inside the tree, before the failure goes to the planner.
    max_action_retries: 2
    skill_timeout_sec: 60.0
    server_wait_sec: 5.0
    world_update_timeout_sec: 1.0
    # Test hook: fail this skill this many times before it is allowed to run.
    inject_failure_skill: ""
    inject_failure_count: 0
