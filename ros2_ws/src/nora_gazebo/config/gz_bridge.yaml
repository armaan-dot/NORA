# gz_bridge.yaml — ros_gz_bridge topic mapping for NORA Gazebo simulation.
#
# Format (ros_gz_bridge):
#   - ros_topic_name: <ROS 2 topic>
#     gz_topic_name:  <Gazebo topic>
#     ros_type_name:  <ROS 2 message type>
#     gz_type_name:   <Gazebo message type>
#     direction:      BIDIRECTIONAL | GZ_TO_ROS | ROS_TO_GZ
#
# TODO(nora): adjust gz_topic_name prefixes to match actual Gazebo model names.

- ros_topic_name: /clock
  gz_topic_name:  /clock
  ros_type_name:  rosgraph_msgs/msg/Clock
  gz_type_name:   gz.msgs.Clock
  direction:      GZ_TO_ROS

- ros_topic_name: /joint_states
  gz_topic_name:  /world/tabletop/model/nora_arm/joint_state
  ros_type_name:  sensor_msgs/msg/JointState
  gz_type_name:   gz.msgs.Model
  direction:      GZ_TO_ROS

- ros_topic_name: /tf
  gz_topic_name:  /world/tabletop/pose/info
  ros_type_name:  tf2_msgs/msg/TFMessage
  gz_type_name:   gz.msgs.Pose_V
  direction:      GZ_TO_ROS

- ros_topic_name: /cmd_vel
  gz_topic_name:  /cmd_vel
  ros_type_name:  geometry_msgs/msg/Twist
  gz_type_name:   gz.msgs.Twist
  direction:      ROS_TO_GZ

# TODO(nora): add camera / depth sensor bridge entries once sensors are added
