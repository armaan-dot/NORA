nora_perception:
  ros__parameters:
    # Colour detection for plain primitives with no COCO class: labels, hue_min, hue_max (equal-length
    # arrays, OpenCV hue 0-179; hue_min > hue_max wraps around 0). Every object in tabletop.world has a
    # COCO class, so none are set.
    min_saturation: 80
    min_value: 40
    min_area_px: 150
    # COCO-trained YOLOX (Apache-2.0), run with onnxruntime. Downloaded on first start.
    model_path: "~/.ros/nora/yolox_tiny.onnx"
    model_url: "https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_tiny.onnx"
    input_size: 416
    score_threshold: 0.35
    nms_threshold: 0.45
    # COCO classes reported; the rest (person, dining table, ...) are ignored.
    classes: ["bottle", "wine glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple",
              "orange", "sandwich", "donut", "sports ball", "book", "scissors", "cell phone",
              "remote", "mouse", "teddy bear", "vase", "toothbrush", "clock"]
    # Report COCO classes under the names the world and the web simulator use ("coco name:label").
    class_aliases: ["cup:mug", "wine glass:glass", "sports ball:tennis_ball", "bottle:can", "book:notebook"]
    output_frame: "base_link"
    color_topic: "/camera/color/image_raw"
    depth_topic: "/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/color/camera_info"
    detections_topic: "/nora/perception/detections"
