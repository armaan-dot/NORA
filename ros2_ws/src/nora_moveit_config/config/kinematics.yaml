# nora_moveit_config/config/kinematics.yaml
#
# Kinematics solver configuration for MoveIt 2.
# KDLKinematicsPlugin is the default numerical IK solver bundled with MoveIt.
# Replace with bio_ik or track_ik for improved performance on redundant arms.

arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05        # seconds
  kinematics_solver_attempts: 3
  tip_link: gripper_link                 # end-effector link for IK queries

gripper:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  tip_link: gripper_link
