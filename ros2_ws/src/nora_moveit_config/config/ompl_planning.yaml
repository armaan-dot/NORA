# nora_moveit_config/config/ompl_planning.yaml
#
# OMPL planner configuration for the NORA arm.
# Reference: https://moveit.picknik.ai/main/doc/how_to_guides/ompl_interface/ompl_interface_tutorial.html

planning_plugin: ompl_interface/OMPLPlanner

request_adapters:
  - default_planning_request_adapters/ResolveConstraintFrames
  - default_planning_request_adapters/ValidateWorkspaceBounds
  - default_planning_request_adapters/CheckStartStateBounds
  - default_planning_request_adapters/CheckStartStateCollision

response_adapters:
  - default_planning_response_adapters/AddTimeOptimalParameterization
  - default_planning_response_adapters/ValidateSolution

# Default planner used when the client does not specify one.
default_planner_config: RRTConnect

# ── Per-group planner configurations ──────────────────────────────────────────
arm:
  default_planner_config: RRTConnect
  planner_configs:
    - RRTConnect
    - RRT
    - RRTstar
    - PRM
    - PRMstar
    - LBTRRT
    - TRRT
    - SPARS

planner_configs:
  RRTConnect:
    type: geometric::RRTConnect
    range: 0.0          # max step length; 0 = auto

  RRT:
    type: geometric::RRT
    range: 0.0
    goal_bias: 0.05

  RRTstar:
    type: geometric::RRTstar
    range: 0.0
    goal_bias: 0.05
    delay_collision_checking: 1

  PRM:
    type: geometric::PRM
    max_nearest_neighbors: 10

  PRMstar:
    type: geometric::PRMstar

  LBTRRT:
    type: geometric::LBTRRT
    range: 0.0
    goal_bias: 0.05
    epsilon: 0.4

  TRRT:
    type: geometric::TRRT
    range: 0.0
    goal_bias: 0.05
    max_states_failed: 10
    temp_change_factor: 2.0
    min_temperature: 10e-10
    init_temperature: 10e-6
    frountier_threshold: 0.0
    frountier_node_ratio: 0.1

  SPARS:
    type: geometric::SPARS
    stretch_factor: 3.0
    sparse_delta_fraction: 0.25
    dense_delta_fraction: 0.001
    max_failures: 1000
