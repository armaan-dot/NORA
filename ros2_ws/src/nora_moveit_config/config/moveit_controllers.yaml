# nora_moveit_config/config/moveit_controllers.yaml
#
# Maps MoveIt trajectory execution to ros2_control controllers.
# These names must match the controller names spawned by nora_control.

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

# ── Arm trajectory controller ─────────────────────────────────────────────────
arm_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6

# ── Gripper action controller ─────────────────────────────────────────────────
gripper_controller:
  action_ns: gripper_cmd
  type: GripperCommand
  default: true
  joints:
    - gripper_joint
