# nora_moveit_config/config/moveit_controllers.yaml
#
# Maps MoveIt trajectory execution to ros2_control controllers for UR5e.

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

# ── Arm trajectory controller ─────────────────────────────────────────────────
arm_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint

# ── Gripper action controller ─────────────────────────────────────────────────
gripper_controller:
  action_ns: gripper_cmd
  type: GripperCommand
  default: true
  joints:
    - gripper_joint
