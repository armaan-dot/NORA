# nora_moveit_config/config/joint_limits.yaml
#
# Joint velocity and acceleration limits used by MoveIt trajectory generation for UR5e.
# Units: velocity  → rad/s
#        acceleration → rad/s²

joint_limits:
  shoulder_pan_joint:
    has_velocity_limits: true
    max_velocity: 3.14159          # π rad/s ≈ 180 °/s
    has_acceleration_limits: true
    max_acceleration: 6.28318

  shoulder_lift_joint:
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 6.28318

  elbow_joint:
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 6.28318

  wrist_1_joint:
    has_velocity_limits: true
    max_velocity: 6.28318          # 2π rad/s ≈ 360 °/s
    has_acceleration_limits: true
    max_acceleration: 12.56636

  wrist_2_joint:
    has_velocity_limits: true
    max_velocity: 6.28318
    has_acceleration_limits: true
    max_acceleration: 12.56636

  wrist_3_joint:
    has_velocity_limits: true
    max_velocity: 6.28318
    has_acceleration_limits: true
    max_acceleration: 12.56636

  gripper_joint:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0
