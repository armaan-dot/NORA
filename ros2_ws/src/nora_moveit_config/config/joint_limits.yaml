# nora_moveit_config/config/joint_limits.yaml
#
# Joint velocity and acceleration limits used by MoveIt trajectory generation.
# Units: velocity  → rad/s (gripper_joint: m/s)
#        acceleration → rad/s² (gripper_joint: m/s²)
#
# Velocities are the URDF limits; accelerations are the ones the web
# simulator's planner uses (JOINT_MAX_ACCELERATION in kinematics.ts).

joint_limits:
  joint1:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 8.0

  joint2:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 8.0

  joint3:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 10.0

  joint4:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 16.0

  joint5:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 16.0

  joint6:
    has_velocity_limits: true
    max_velocity: 3.14
    has_acceleration_limits: true
    max_acceleration: 16.0

  gripper_joint:
    has_velocity_limits: true
    max_velocity: 0.15
    has_acceleration_limits: true
    max_acceleration: 1.0
