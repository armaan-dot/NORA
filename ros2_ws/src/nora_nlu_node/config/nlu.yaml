# nora_nlu_node/config/nlu.yaml
#
# ROS 2 parameter file for the NLU node.
# Load with: ros2 run nora_nlu_node nora_nlu_node --ros-args --params-file nlu.yaml

nlu_node:
  ros__parameters:
    # Absolute path to the local HuggingFace model directory.
    # Example: /home/nora/models/nora-nlu-v1
    model_path: ""

    # Intents with confidence below this threshold will trigger a warning.
    confidence_threshold: 0.5
