# nora_nlu_node/config/nlu.yaml
#
# ROS 2 parameter file for the NLU node.
# Load with: ros2 run nora_nlu_node nora_nlu_node --ros-args --params-file nlu.yaml

nlu_node:
  ros__parameters:
    # NLU backend to use.
    # Options:
    #   "mock"  — rule-based keyword parser (no ML, always available)
    #   "local" — local HuggingFace fine-tuned model (requires model_path)
    backend: mock

    # Absolute path to the local HuggingFace model directory.
    # Only used when backend == "local".
    # Example: /home/nora/models/nora-nlu-v1
    model_path: ""

    # Local Ollama settings, used only when backend == "ollama".
    # Download the model first: ollama pull qwen2.5:1.5b
    ollama_model: "qwen2.5:1.5b"
    ollama_host: "http://localhost:11434"
    ollama_timeout_seconds: 30.0

    # Intents with confidence below this threshold will trigger a warning.
    confidence_threshold: 0.5
