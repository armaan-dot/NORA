# joint_limits.yaml — position, velocity, and effort limits for the UR5e arm.
# Used by ros2_control, MoveIt 2, and trajectory planners.

joint_limits:

  shoulder_pan_joint:
    has_position_limits: true
    min_position: -6.28318   # -2π rad
    max_position:  6.28318   # +2π rad
    has_velocity_limits: true
    max_velocity: 3.14159    # 180 °/s
    has_acceleration_limits: false
    has_effort_limits: true
    max_effort: 150.0        # N·m

  shoulder_lift_joint:
    has_position_limits: true
    min_position: -6.28318
    max_position:  6.28318
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: false
    has_effort_limits: true
    max_effort: 150.0

  elbow_joint:
    has_position_limits: true
    min_position: -3.14159
    max_position:  3.14159
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: false
    has_effort_limits: true
    max_effort: 150.0

  wrist_1_joint:
    has_position_limits: true
    min_position: -6.28318
    max_position:  6.28318
    has_velocity_limits: true
    max_velocity: 6.28318    # 360 °/s
    has_acceleration_limits: false
    has_effort_limits: true
    max_effort: 28.0

  wrist_2_joint:
    has_position_limits: true
    min_position: -6.28318
    max_position:  6.28318
    has_velocity_limits: true
    max_velocity: 6.28318
    has_acceleration_limits: false
    has_effort_limits: true
    max_effort: 28.0

  wrist_3_joint:
    has_position_limits: true
    min_position: -6.28318
    max_position:  6.28318
    has_velocity_limits: true
    max_velocity: 6.28318
    has_acceleration_limits: false
    has_effort_limits: true
    max_effort: 28.0

  gripper_joint:
    has_position_limits: true
    min_position: 0.0        # [m] fully closed
    max_position: 0.08       # [m] fully open
    has_velocity_limits: true
    max_velocity: 0.5        # [m/s]
    has_acceleration_limits: false
    has_effort_limits: true
    max_effort: 50.0         # [N]
