# joint_limits.yaml — position, velocity, and effort limits for the NORA arm.
# Used by ros2_control, MoveIt2, and any trajectory planning stack.
# Values match nora_arm.urdf.xacro (same as the web simulator's nora_arm.urdf).

joint_limits:

  joint1:
    has_position_limits: true
    min_position: -6.2832    # [rad]  -2π
    max_position:  6.2832    # [rad]  +2π
    has_velocity_limits: true
    max_velocity: 3.14       # [rad/s]
    has_acceleration_limits: false
    has_effort_limits: true
    max_effort: 150.0        # [N·m]

  joint2:
