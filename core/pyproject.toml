[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nora-core"
version = "0.1.0"
description = "ROS-free core library for NORA: intent models, skill registry, affordance scoring, planning"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "jsonschema>=4.0"]

[tool.setuptools.packages.find]
where = ["."]  # finds nora_core/
